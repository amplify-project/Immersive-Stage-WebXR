<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360° Player</title>
<link rel="stylesheet" href="./src/styles/player.css">
</head>
<body>

<!-- Elementos en DOM desde el inicio — necesario para Web Audio API -->
<video id="hidden-video" playsinline crossorigin="anonymous" muted
  style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:-9999px"></video>
<audio id="hidden-audio" crossorigin="anonymous"
  style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:-9999px"></audio>
<!-- Close-up (Caso B): vídeo del músico enfocado, en un plano flotante -->
<video id="hidden-closeup" playsinline crossorigin="anonymous" muted
  style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:-9999px"></video>

<!-- Source loader -->
<div id="loader">
  <h1>360° Ambisonics Player</h1>
  <div class="url-row">
    <input type="text" id="video-url-input" placeholder="URL manifest .mpd — vídeo + audio ambisonics" />
    <button onclick="loadFromURL()">Cargar</button>
  </div>
  <span class="or-divider">— o arrastra un fichero —</span>
  <div id="drop-zone">
    <input type="file" id="file-input" accept="video/*,.mpd,.m3u8" onchange="loadFile(this)">
    <p><strong>Arrastra tu manifest o vídeo 360°</strong><br>MPD equirectangular con audio ambisonics</p>
  </div>
</div>

<!-- Spinner -->
<div id="spinner"><div class="spin-ring"></div></div>

<!-- Three.js canvas -->
<div id="canvas-container">
  <canvas id="three-canvas"></canvas>
</div>

<!-- Ambisonics visualizer -->
<div id="ambi-viz"><canvas id="ambi-canvas" width="80" height="80"></canvas></div>

<!-- Gyro badge -->
<div id="gyro-badge">◎ GYRO</div>

<!-- HUD -->
<div id="hud">
  <div id="topbar">
    <div id="logo">360° · Ambisonics · WebXR</div>
    <div id="status-row">
      <span class="badge badge-360">equirect</span>
      <span class="badge badge-ambi" id="ambi-badge" style="display:none">ambi B-fmt</span>
      <span class="badge badge-live" id="live-badge" style="display:none">● live</span>
      <span class="badge badge-xr"  id="xr-badge"   style="display:none">WebXR</span>
      <span id="delay-badge">⏱ --s</span>
    </div>
  </div>

  <div id="controls">
    <div id="progress-area">
      <div id="seekbar" onclick="seekTo(event)">
        <div id="seekbar-fill"></div>
        <div id="seekbar-thumb"></div>
      </div>
    </div>
    <div id="ctrl-row">
      <button class="ctrl-btn" id="play-btn" onclick="togglePlay()" title="Play/Pause">▶</button>
      <button class="ctrl-btn" onclick="skipBack()" title="-10s">↺</button>
      <button class="ctrl-btn" onclick="skipFwd()"  title="+10s">↻</button>
      <span id="time-display">0:00 / 0:00</span>
      <div id="vol-row">
        <button class="ctrl-btn" id="mute-btn" onclick="toggleMute()" title="Mute">🔊</button>
        <input type="range" id="vol-slider" min="0" max="1" step="0.02" value="1" oninput="setVolume(this.value)">
      </div>
      <button class="ctrl-btn" onclick="resetView()" title="Centrar vista">⊙</button>
      <button class="ctrl-btn" onclick="toggleFS()"  title="Pantalla completa">⛶</button>
      <button id="xr-btn" disabled onclick="enterXR()">VR</button>
      <button id="ar-btn" disabled onclick="enterAR()">AR</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.compiled.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/numeric@1.2.6/numeric-1.2.6.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/spherical-harmonic-transform@0.1.1/bundle/spherical-harmonic-transform.js"></script>
<!-- Omnitone (binaural FOA con HRTF embebidos) — vendorizado, funciona offline -->
<script src="./src/vendor/omnitone.min.js"></script>
<!-- Mallas de los músicos en AR (scene.json → stems[i].mesh). Vendorizado y no del
     CDN a propósito: tiene que ser exactamente la r128 del three de arriba. -->
<script src="./src/vendor/GLTFLoader.js"></script>
<!-- Carga y ajuste de las mallas, compartido con el editor: la vista previa de
     allí tiene que colocar el modelo igual que aquí, o no sirve de nada. -->
<script src="./src/app/mesh-fit.js"></script>

<script type="module" src="./src/app/player.js"></script>
</body>
</html>
